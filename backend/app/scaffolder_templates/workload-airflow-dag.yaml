id: workload-airflow-dag
name: Airflow Batch Workload
type: component
kind: workload
technology: airflow
platform: Astronomer
provisioner: airflow
icon: workflow
description: >-
  A scheduled pipeline that feeds the storage areas of the data product. Ships
  with a generated DAG skeleton in the repository.
tags: [batch, orchestration]

parameters:
  - title: Component
    fields:
      - name: name
        title: Name
        type: string
        required: true
        pattern: "^[a-z0-9]([a-z0-9-]{1,62}[a-z0-9])$"
        patternMessage: Use lowercase letters, digits and dashes
        placeholder: daily-ingestion
      - name: displayName
        title: Display name
        type: string
      - name: description
        title: Description
        type: text
        required: true

  - title: Schedule
    fields:
      - name: schedule
        title: Schedule
        type: select
        default: "0 2 * * *"
        options:
          - value: "@hourly"
            label: Hourly
          - value: "0 2 * * *"
            label: Daily at 02:00
          - value: "0 2 * * 1"
            label: Weekly, Monday 02:00
          - value: "@once"
            label: Manual only
      - name: retries
        title: Retries
        type: number
        default: 2
      - name: slaMinutes
        title: SLA (minutes)
        type: number
        default: 90
      - name: writesTo
        title: Writes to
        type: string
        placeholder: curated-orders
        help: Name of the storage component this workload populates.
      - name: readsFrom
        title: Reads from
        type: tags
        placeholder: "urn:dmp:crm:orders:0:order-events"
        help: URNs of output ports this workload consumes, if any.

component:
  name: "{{ name }}"
  displayName: "{{ displayName }}"
  description: "{{ description }}"
  kind: workload
  version: 0.1.0
  technology: airflow
  platform: Astronomer
  useCaseTemplateId: workload-airflow-dag
  infrastructureTemplateId: provisioner-airflow
  dependsOn: ${readsFrom}
  specific:
    dagId: "{{ __domain__ }}_{{ __data_product__ }}_{{ name | replace('-', '_') }}"
    schedule: "{{ schedule }}"
    retries: ${retries}
    slaMinutes: ${slaMinutes}
    writesTo: "{{ writesTo }}"
    executor: KubernetesExecutor

files:
  - path: "components/{{ name }}/dag.py"
    content: |
      """{{ displayName or name }} — {{ description }}

      Generated by the DataMesh Platform scaffolder. The schedule and retries
      below are kept in sync with the descriptor on every provisioning run.
      """

      from datetime import datetime, timedelta

      from airflow import DAG
      from airflow.operators.python import PythonOperator

      DAG_ID = "{{ __domain__ }}_{{ __data_product__ }}_{{ name | replace('-', '_') }}"

      default_args = {
          "owner": "{{ __owner__ }}",
          "retries": {{ retries }},
          "retry_delay": timedelta(minutes=5),
          "sla": timedelta(minutes={{ slaMinutes }}),
      }

      with DAG(
          DAG_ID,
          schedule="{{ schedule }}",
          start_date=datetime(2024, 1, 1),
          catchup=False,
          default_args=default_args,
          tags=["{{ __domain__ }}", "{{ __data_product__ }}"],
      ) as dag:

          def extract(**context):
              """Read from the upstream output ports declared in the descriptor."""
      {% for urn in readsFrom %}        # {{ urn }}
      {% endfor %}        raise NotImplementedError

          def load(**context):
              """Write into {{ writesTo or 'the storage area of this data product' }}."""
              raise NotImplementedError

          PythonOperator(task_id="extract", python_callable=extract) >> \
              PythonOperator(task_id="load", python_callable=load)
