id: outputport-kafka-topic
name: Kafka Topic Output Port
type: component
kind: outputport
technology: kafka
platform: Confluent
provisioner: kafka
icon: radio
description: >-
  Streams domain events on a Kafka topic with a registered Avro schema, for
  consumers that need the data as it happens.
tags: [streaming, events, real-time]

parameters:
  - title: Component
    fields:
      - name: name
        title: Name
        type: string
        required: true
        pattern: "^[a-z0-9]([a-z0-9-]{1,62}[a-z0-9])$"
        patternMessage: Use lowercase letters, digits and dashes
        placeholder: order-events
      - name: displayName
        title: Display name
        type: string
      - name: description
        title: Description
        type: text
        required: true

  - title: Topic
    fields:
      - name: topic
        title: Topic name
        type: string
        required: true
        placeholder: sales.order.events.v1
      - name: partitions
        title: Partitions
        type: number
        default: 6
      - name: replication
        title: Replication factor
        type: number
        default: 3
      - name: retentionHours
        title: Retention (hours)
        type: number
        default: 168
      - name: cleanupPolicy
        title: Cleanup policy
        type: select
        default: delete
        options: [delete, compact]
      - name: keyField
        title: Key field
        type: string
        default: id

  - title: Data contract
    fields:
      - name: columns
        title: Event schema
        type: schema
        required: true
      - name: timeliness
        title: Timeliness
        type: string
        default: 5 seconds
      - name: upTime
        title: Availability
        type: string
        default: 99.9%
      - name: termsAndConditions
        title: Terms and conditions
        type: text
        default: At-least-once delivery. Consumers must be idempotent.
      - name: tags
        title: Tags
        type: tags
        help: Add `pii` when the topic carries personal data.

component:
  name: "{{ name }}"
  displayName: "{{ displayName }}"
  description: "{{ description }}"
  kind: outputport
  version: 0.1.0
  technology: kafka
  platform: Confluent
  outputPortType: Streaming
  tags: ${tags}
  useCaseTemplateId: outputport-kafka-topic
  infrastructureTemplateId: provisioner-kafka
  dataContract:
    termsAndConditions: "{{ termsAndConditions }}"
    endpoint: "kafka://broker.acme.internal:9092/{{ topic }}"
    schema: ${columns}
    SLA:
      intervalOfChange: continuous
      timeliness: "{{ timeliness }}"
      upTime: "{{ upTime }}"
  specific:
    topic: "{{ topic }}"
    partitions: ${partitions}
    replicationFactor: ${replication}
    retentionHours: ${retentionHours}
    cleanupPolicy: "{{ cleanupPolicy }}"
    keyField: "{{ keyField }}"
    schemaFormat: AVRO
    consumerGroupPrefix: "{{ name }}-consumer"

files:
  - path: "components/{{ name }}/schema.avsc"
    content: |
      {
        "type": "record",
        "name": "{{ name | replace('-', '_') }}",
        "namespace": "io.acme.{{ topic.split('.')[0] }}",
        "fields": [
      {% for column in columns %}    {"name": "{{ column.name }}", "type": {{ '"' ~ column.dataType ~ '"' if not column.get('nullable', True) else '["null", "' ~ column.dataType ~ '"]' }}, "doc": "{{ column.get('description', '') }}"}{{ "," if not loop.last }}
      {% endfor %}  ]
      }
